# ARIA - Autonomous Reflective Intelligence Architecture
# Configuración Principal

aria:
  name: "ARIA"
  version: "0.8.0"
  creator: "William"
  co_creator: "Claude"
  created_at: "2025-12-26"

# API Configuration - Multi-Provider LLM
# Proveedores soportados:
#   - anthropic: Claude (requiere ANTHROPIC_API_KEY)
#   - openai: GPT-4, GPT-3.5 (requiere OPENAI_API_KEY)
#   - google: Gemini (requiere GOOGLE_API_KEY)
#   - deepseek: DeepSeek (requiere DEEPSEEK_API_KEY)
#   - openrouter: Múltiples modelos (requiere OPENROUTER_API_KEY)
#   - ollama: Modelos locales (no requiere API key)
#
# Si no se especifica provider, ARIA auto-detecta basado en las API keys disponibles
api:
  provider: "deepseek"
  model: "deepseek-chat"
  max_tokens: 4096
  temperature: 0.7

# Ejemplos de configuración por proveedor:
#
# Anthropic (Claude):
#   provider: "anthropic"
#   model: "claude-sonnet-4-20250514"  # o claude-3-opus-20240229
#
# OpenAI:
#   provider: "openai"
#   model: "gpt-4o"  # o gpt-4-turbo, gpt-3.5-turbo
#
# Google (Gemini):
#   provider: "google"
#   model: "gemini-1.5-pro"
#
# DeepSeek:
#   provider: "deepseek"
#   model: "deepseek-chat"
#
# Ollama (local):
#   provider: "ollama"
#   model: "llama3"  # o mistral, codellama, etc.

