[supervisord]
nodaemon=true
user=aria
logfile=/dev/stdout
logfile_maxbytes=0

[program:fastapi]
command=python -m core.api.server --port 8000 --host 0.0.0.0
directory=/app
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:sveltekit]
command=node /app/web/build/index.js
directory=/app/web
autostart=true
autorestart=true
environment=PORT=3000,HOST=0.0.0.0,NODE_ENV=production,ORIGIN=%(ENV_ARIA_ORIGIN)s,ARIA_FASTAPI_URL=http://localhost:8000,ARIA_INTERNAL_SECRET=%(ENV_ARIA_INTERNAL_SECRET)s,ARIA_ALLOWED_EMAILS=%(ENV_ARIA_ALLOWED_EMAILS)s,RESEND_API_KEY=%(ENV_RESEND_API_KEY)s,RESEND_FROM_EMAIL=%(ENV_RESEND_FROM_EMAIL)s,ARIA_AUTH_DB=/app/data/auth/auth.db
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
